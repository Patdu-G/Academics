<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>

    <body>
        <div class="container">
            <div class="row" id="parent">
                <!-- cards render here -->
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
        <script>
            class ProductCard {
                constructor(category, title, specs, price, image) {
                    this.category = category;
                    this.title = title;
                    this.specs = specs;
                    this.price = price;
                    this.image = image;
                }
                render() {
                    return `
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card p-3 my-3 shadow rounded-4">
          <div class="row g-3">
            <div class="col-5">
              <img src="${this.image}" class="img-fluid rounded-3" alt="${this.title}">
            </div>
            <div class="col-7">
              <div class="text-uppercase text-muted small">${this.category}</div>
              <div class="h5">${this.title}</div>
              <div class="small text-secondary">(${this.specs})</div>
            </div>
          </div>
          <div class="h4 mt-3">₱${this.price.toLocaleString("en-PH", { minimumFractionDigits: 2 })}</div>
          <button class="btn btn-dark rounded-pill">Add to Cart</button>
        </div>
      </div>`;
                }
            }

            var elParent = document.getElementById("parent");

            var products = [
                new ProductCard("Marvel", "Doctor Doom", "Funko Pop #561, vinyl, 3.75 in", 1000, "img/doom.png"),
                new ProductCard("DC", "Batman", "Funko Pop #01, vinyl, 3.75 in", 899, "img/batman.png"),
                new ProductCard("Pokémon", "Pikachu", "Funko Pop #353, vinyl, 3.75 in", 999, "img/pikachu.png"),
            ];

            products.forEach((p) => {
                elParent.innerHTML += p.render();
            });
        </script>
    </body>


</html>
