<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .card {
            border-radius: 1rem;
        }

        .site-header {
            background-color: #550700;
            color: #e6d61e;
            
        }

        .site-header h1 {
            font-size: 1.75rem;
            letter-spacing: 1px;
        }

        body {
            background-color: #02271b;
            color: #e8f5ee;
        }

        .bento-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }


        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(3, 200px);
            gap: 0.5rem;
        }

        .bento-title {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
        }

        .bento-img-tall {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.title-bar {
    width: 60px;
    height: 4px;
    border-radius: 2px;
    margin: 0.6rem 0;
}
.bar-ironman { background: #8b0f1f; }
.bar-doom    { background: #1f5c1a; }

.bento-tagline {
    font-size: 0.8rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555;
    margin: 0;
}

.bento-caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 2rem 1rem 0.75rem;
    background: linear-gradient(to top, rgba(7, 36, 27, 0.9), transparent);
    color: #e8f5ee;
}
.bento-caption h3 {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0;
}
.bento-caption p {
    font-size: 0.8rem;
    letter-spacing: 2px;
    margin: 0;
    opacity: 0.85;
}

        

        .title-ironman {
            color: #8b0f1f;
        }

        .title-doom {
            color: #1f5c1a;
        }

        .b-ironman {
            grid-column: 1 / span 9;
            grid-row: 1;
        }

        .b-right {
            grid-column: 10 / span 3;
            grid-row: 1 / span 2;
        }

        .b-left {
            grid-column: 1 / span 3;
            grid-row: 2 / span 2;
        }

        .b-pic {
            grid-column: 4 / span 6;
            grid-row: 2;
        }

        .b-doom {
            grid-column: 4 / span 9;
            grid-row: 3;
        }
    </style>
</head>

<body>
    <header class="site-header text-center py-4">
        <h1 class="m-0">Marvel Cinematic Universe's Anchor Being</h1>
    </header>

    <div class="container py-4">
        <div class="bento-grid">

            <div class="card overflow-hidden b-ironman">
                <div class="row g-0 h-100">
                    <div class="col-4">
                        <img src="assets/ironman.jpg" class="bento-img" style="object-position: center 1%;"
                            alt="Iron Man">
                    </div>
                    <div class="col-8 p-3 d-flex flex-column align-items-center justify-content-center text-center">
    <h2 class="bento-title title-ironman m-0">Ironman</h2>
    <div class="title-bar bar-ironman"></div>
    <p class="bento-tagline">Armored Avenger</p>
</div>
                </div>
            </div>

            <div class="card overflow-hidden b-right">
    <img src="assets/detail.jpg" class="bento-img-tall" style="object-position: center 20%;" alt="Describe the picture">
</div>

           <div class="card overflow-hidden b-left">
    <img src="assets/doomquest.jpg" class="bento-img-tall" style="object-position: center 20%;" alt="Describe the picture">
</div>

            <div class="card overflow-hidden b-pic">
                <img src="assets/pic.jpg" class="bento-img" style="object-position: center 25%;" alt="Photo">

            </div>

            <div class="card overflow-hidden b-doom">
                <div class="row g-0 h-100">
                    <div class="col-8 p-3 d-flex flex-column align-items-center justify-content-center text-center">
    <h2 class="bento-title title-doom m-0">Dr. Doom</h2>
    <div class="title-bar bar-doom"></div>
    <p class="bento-tagline">Monarch of Latveria</p>
</div>
                    <div class="col-4">
                        <img src="assets/doom.jpg" class="bento-img" style="object-position: center 15%;"
                            alt="Dr. Doom">
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
