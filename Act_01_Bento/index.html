<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .card {
            border-radius: 1rem;
        }

        .site-header {
            background-color: #0b3d2e;
            color: #e8f5ee;
            border-bottom: 3px solid #033d26;
        }

        .site-header h1 {
            font-size: 1.75rem;
            letter-spacing: 1px;
        }

        body {
            background-color: #07241b;
            color: #e8f5ee;
        }

        .bento-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }


        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(3, 200px);
            gap: 0.5rem;
        }

        .b-ironman {
            grid-column: 1 / span 9;
            grid-row: 1;
        }

        .b-right {
            grid-column: 10 / span 3;
            grid-row: 1 / span 2;
        }

        .b-left {
            grid-column: 1 / span 3;
            grid-row: 2 / span 2;
        }

        .b-pic {
            grid-column: 4 / span 6;
            grid-row: 2;
        }

        .b-doom {
            grid-column: 4 / span 9;
            grid-row: 3;
        }
    </style>
</head>

<body>
    <header class="site-header text-center py-4">
        <h1 class="m-0">Marvel Cinematic Universe's Anchor Being</h1>
    </header>

    <div class="container py-4">
        <div class="bento-grid">

            <div class="card overflow-hidden b-ironman">
                <div class="row g-0 h-100">
                    <div class="col-4">
                        <img src="assets/ironman.jpg" class="bento-img" style="object-position: center 1%;"
                            alt="Iron Man">
                    </div>
                    <div class="col-8 p-3">Ironman</div>
                </div>
            </div>

            <div class="card p-3 b-right"></div>

            <div class="card p-3 b-left"></div>

            <div class="card overflow-hidden b-pic">
                <img src="assets/pic.jpg" class="bento-img" style="object-position: center 25%;" alt="Photo">

            </div>

            <div class="card overflow-hidden b-doom">
                <div class="row g-0 h-100">
                    <div class="col-8 p-3">Dr. Doom</div>
                    <div class="col-4">
                        <img src="assets/doom.jpg" class="bento-img" style="object-position: center 15%;"
                            alt="Dr. Doom">
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
